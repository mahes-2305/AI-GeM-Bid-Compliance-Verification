services:
  backend:
    image: ${ECR_REGISTRY}/nexverify-backend:latest
    container_name: nexverify-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    networks:
      - nexverify-network

  frontend:
    image: ${ECR_REGISTRY}/nexverify-frontend:latest
    container_name: nexverify-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - nexverify-network

networks:
  nexverify-network:
    driver: bridge

volumes:
  backend-data:
  backend-uploads:
